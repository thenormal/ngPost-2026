name: Idea or suggestion
description: Suggest an improvement or a new feature
title: "[Idea] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for sharing an idea. In the program: About > Feedback > Suggest an idea fills the version and the system for you.
  - type: input
    id: version
    attributes:
      label: Version of ngPost Deluxe
      placeholder: "1.3"
  - type: input
    id: system
    attributes:
      label: Operating system and Qt version
      placeholder: "Windows 11, Qt 5.15.2"
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: What would you like to do that you cannot do today?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why it would help
