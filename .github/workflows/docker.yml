name: Docker image

# Builds the command line version of ngPost Deluxe as a Docker image (for NAS / servers, Unraid...).
# - pull request or branch: the image is only built, to check that it works
# - tag v* (v1.1, v1.2...): the image is published on ghcr.io/thenormal/ngpost-deluxe (tags 1.1 and latest)
on:
  push:
    tags: [ 'v*' ]
  pull_request:
    paths:
      - 'Dockerfile'
      - 'docker/**'
      - 'src/**'
      - '.github/workflows/docker.yml'
  workflow_dispatch:

jobs:
  image:
    name: Build the image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Image name and tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/ngpost-deluxe
          tags: |
            type=match,pattern=v(.*),group=1
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=branch
            type=ref,event=pr

      - name: Log in to ghcr.io
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and publish for a tag)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          load: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Quick test of the image
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: |
          img=$(echo "${{ steps.meta.outputs.tags }}" | head -n 1)
          docker run --rm --entrypoint ngPost "$img" --help > /dev/null
          docker run --rm --entrypoint parpar "$img" --help > /dev/null
          docker run --rm --entrypoint 7z "$img" i > /dev/null
          # without configuration the container must explain what is missing and stop
          if docker run --rm "$img"; then
            echo "::error::the container should refuse to start without configuration"
            exit 1
          fi
