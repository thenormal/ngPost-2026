name: Build Windows (x64)

# Builds ngPost-2026 on a Windows runner (Qt 5.15.2 + MinGW 8.1, 64bit) and publishes a
# ready-to-run folder as a downloadable artifact: Actions tab > the run > "Artifacts".
on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt 5.15.2 (MinGW 8.1, 64bit)
        uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_mingw81'
          tools: 'tools_mingw,qt.tools.win64_mingw810 tools_openssl_x64,qt.tools.openssl.win_x64'
          cache: true

      - name: Build
        shell: pwsh
        run: |
          mkdir build
          cd build
          qmake ../src/ngPost.pro CONFIG+=release CONFIG-=debug CONFIG-=debug_and_release
          mingw32-make -j2

      - name: Assemble the package
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path build -Recurse -Filter ngPost.exe | Select-Object -First 1
          if (-not $exe) { throw "ngPost.exe not found" }
          mkdir dist
          Copy-Item $exe.FullName dist/
          # Qt DLLs, plugins and the MinGW runtime (copied by hand: windeployqt could not find the platform plugin)
          $qtRoot = $env:QT_ROOT_DIR
          $gccBin = Join-Path $env:IQTA_TOOLS 'mingw810_64\bin'
          if (-not (Test-Path $gccBin)) { $gccBin = Split-Path (Get-Command g++.exe).Source }
          foreach ($n in 'Qt5Core','Qt5Gui','Qt5Network','Qt5Widgets') { Copy-Item "$qtRoot\bin\$n.dll" dist/ }
          foreach ($n in 'libgcc_s_seh-1','libstdc++-6','libwinpthread-1') { Copy-Item "$gccBin\$n.dll" dist/ }
          New-Item -ItemType Directory dist/platforms, dist/imageformats | Out-Null
          Copy-Item "$qtRoot\plugins\platforms\qwindows.dll" dist/platforms/
          foreach ($n in 'qjpeg','qgif','qico') { Copy-Item "$qtRoot\plugins\imageformats\$n.dll" dist/imageformats/ }
          # OpenSSL 1.1.1 DLLs needed by Qt 5 for ssl connections (Qt 5.15 does not support OpenSSL 3).
          # Taken from the official Qt "OpenSSL Toolkit" (latest 1.1.1), the old 2019 DLLs of the repository are only a fallback.
          $sslBin = Join-Path $env:IQTA_TOOLS 'OpenSSL\Win_x64\bin'
          if (Test-Path "$sslBin\libssl-1_1-x64.dll") {
            Copy-Item "$sslBin\libssl-1_1-x64.dll", "$sslBin\libcrypto-1_1-x64.dll" dist/
          } else {
            Write-Warning "Qt OpenSSL toolkit not found, using the DLLs of the repository"
            Expand-Archive release/libs/libs_win7_64bit.zip -DestinationPath openssl_tmp
            Copy-Item openssl_tmp/libs/libssl-1_1-x64.dll, openssl_tmp/libs/libcrypto-1_1-x64.dll dist/
          }
          (Get-Item dist/libssl-1_1-x64.dll).VersionInfo | Format-List ProductVersion, FileVersion
          # ParPar (par2 generator), used automatically when parpar.exe is next to ngPost.exe
          7z x release/libs/parpar-v0.4.6-win64.7z -oparpar_tmp
          Copy-Item (Get-ChildItem -Path parpar_tmp -Recurse -Filter parpar.exe | Select-Object -First 1).FullName dist/
          Copy-Item ngPost.conf, LICENSE dist/
          Get-ChildItem dist | Format-Table Name, Length

      # Both tests run with a minimal PATH, so that a missing DLL in the package is detected
      # (with the full PATH the Qt DLLs of the runner would be found and hide the problem).
      - name: Smoke test 1 - command line (must start and print its help)
        shell: pwsh
        run: |
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          $out = & "$PWD\dist\ngPost.exe" --help 2>&1 | Out-String
          Write-Host $out
          # 0xC0000135 = a DLL is missing; any other exit code only reflects the sample config (Linux paths)
          if ($LASTEXITCODE -eq -1073741515 -or $LASTEXITCODE -eq -1073741701) { throw "missing DLL (exit code $LASTEXITCODE)" }
          exit 0   # otherwise the step would fail with the exit code of ngPost.exe (the sample config is for Linux)

      - name: Smoke test 3 - SSL support (OpenSSL DLLs loaded by Qt)
        shell: pwsh
        run: |
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          $out = & "$PWD\dist\ngPost.exe" -v 2>&1 | Out-String
          Write-Host $out
          if ($out -notmatch 'SSL support: yes' -or $out -notmatch 'system version: OpenSSL 1\.1\.1') { throw "OpenSSL is not loaded" }
          exit 0

      - name: Smoke test 2 - GUI (must stay open for 8 seconds)
        shell: pwsh
        run: |
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          $p = Start-Process -FilePath "$PWD\dist\ngPost.exe" -WorkingDirectory "$PWD\dist" -PassThru
          Start-Sleep -Seconds 8
          if ($p.HasExited) { throw "the GUI closed by itself, exit code $($p.ExitCode)" }
          Write-Host "GUI is running"
          Stop-Process -Id $p.Id -Force

      - uses: actions/upload-artifact@v4
        with:
          name: ngPost-2026-win64-${{ github.sha }}
          path: dist
