name: Build Windows (64 and 32 bit)

# Builds ngPost Deluxe on a Windows runner (Qt 5.15.2 + MinGW 8.1) for Windows 64 bit and 32 bit and
# publishes a ready-to-run folder as a downloadable artifact: Actions tab > the run > "Artifacts".
# When a tag "v*" is pushed (v1.0, v1.1, v1.2...), a GitHub release is created with the two ZIP files and the two installers.
# A tag with a "-" (v1.3-rc1) is a release candidate: it is published as a pre-release.
on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Windows ${{ matrix.name }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: win64
            qt_arch: win64_mingw81
            qt_tools: 'tools_mingw,qt.tools.win64_mingw810'
            mingw_dir: mingw810_64
            gcc_dll: libgcc_s_seh-1
            ssl_ssl: libssl-1_1-x64.dll
            ssl_crypto: libcrypto-1_1-x64.dll
            ssl_zip: libs_win7_64bit.zip
            arch: x64
            sevenzip: 7z2605-x64.exe
            sevenzip_sha256: FD99E86F57D8F429EF5ED045BF98315AF962E2309B0F1BA87A147A44C71647D0
            mediainfo: MediaInfo_CLI_26.10_Windows_x64.zip
            mediainfo_sha256: 4CC94BD272903914C04F4F9A9F53A6C94B5EA6C6454CF738D29FA182C41E8A29
          - name: win32
            qt_arch: win32_mingw81
            qt_tools: 'tools_mingw,qt.tools.win32_mingw810'
            mingw_dir: mingw810_32
            gcc_dll: libgcc_s_dw2-1
            ssl_ssl: libssl-1_1.dll
            ssl_crypto: libcrypto-1_1.dll
            ssl_zip: libs_win7_32bit.zip
            arch: x86
            sevenzip: 7z2605.exe
            sevenzip_sha256: 6435A470FE7C4769962DBED8A60C641EE21401C833CED06077C80E33E7845A5E
            mediainfo: MediaInfo_CLI_26.10_Windows_i386.zip
            mediainfo_sha256: BCD2BF7F3A5BA826E6F5EBD3D914980CDFCA8EF3D64D2624958660F67B87B710
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt 5.15.2 (MinGW 8.1, ${{ matrix.name }})
        uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'
          host: 'windows'
          target: 'desktop'
          arch: ${{ matrix.qt_arch }}
          tools: ${{ matrix.qt_tools }}
          cache: true

      - name: Build
        shell: pwsh
        run: |
          mkdir build
          cd build
          qmake ../src/ngPost.pro CONFIG+=release CONFIG-=debug CONFIG-=debug_and_release
          mingw32-make -j2

      - name: Assemble the package
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path build -Recurse -Filter ngPostDeluxe.exe | Select-Object -First 1
          if (-not $exe) { throw "ngPostDeluxe.exe not found" }
          mkdir dist
          Copy-Item $exe.FullName dist/
          # Qt DLLs, plugins and the MinGW runtime (copied by hand: windeployqt could not find the platform plugin)
          $qtRoot = $env:QT_ROOT_DIR
          $gccBin = Join-Path $env:IQTA_TOOLS '${{ matrix.mingw_dir }}\bin'
          if (-not (Test-Path $gccBin)) { $gccBin = Split-Path (Get-Command g++.exe).Source }
          foreach ($n in 'Qt5Core','Qt5Gui','Qt5Network','Qt5Widgets') { Copy-Item "$qtRoot\bin\$n.dll" dist/ }
          foreach ($n in '${{ matrix.gcc_dll }}','libstdc++-6','libwinpthread-1') { Copy-Item "$gccBin\$n.dll" dist/ }
          New-Item -ItemType Directory dist/platforms, dist/imageformats | Out-Null
          Copy-Item "$qtRoot\plugins\platforms\qwindows.dll" dist/platforms/
          foreach ($n in 'qjpeg','qgif','qico') { Copy-Item "$qtRoot\plugins\imageformats\$n.dll" dist/imageformats/ }
          # OpenSSL 1.1.1 DLLs needed by Qt 5 for ssl connections (Qt 5.15 does not support OpenSSL 3).
          # Latest 1.1.1 (1.1.1w) from the FireDaemon OpenSSL builds; the old 2019 DLLs of the repository are only a fallback.
          $sslOk = $false
          try {
            Invoke-WebRequest -Uri 'https://download.firedaemon.com/FireDaemon-OpenSSL/openssl-1.1.1w.zip' -OutFile openssl.zip
            Write-Host "openssl.zip SHA256: $((Get-FileHash openssl.zip -Algorithm SHA256).Hash)"
            Expand-Archive openssl.zip -DestinationPath openssl_new
            $ssl    = Get-ChildItem -Path openssl_new -Recurse -Filter ${{ matrix.ssl_ssl }}    | Select-Object -First 1
            $crypto = Get-ChildItem -Path openssl_new -Recurse -Filter ${{ matrix.ssl_crypto }} | Select-Object -First 1
            if ($ssl -and $crypto) { Copy-Item $ssl.FullName, $crypto.FullName dist/; $sslOk = $true }
          } catch { Write-Warning "OpenSSL 1.1.1w download failed: $_" }
          if (-not $sslOk) {
            Write-Warning "using the OpenSSL DLLs of the repository"
            Expand-Archive release/libs/${{ matrix.ssl_zip }} -DestinationPath openssl_tmp
            Copy-Item openssl_tmp/libs/${{ matrix.ssl_ssl }}, openssl_tmp/libs/${{ matrix.ssl_crypto }} dist/
          }
          (Get-Item dist/${{ matrix.ssl_ssl }}).VersionInfo | Format-List ProductVersion, FileVersion
          if ('${{ matrix.name }}' -eq 'win64') {
            # ParPar (par2 generator), used automatically when parpar.exe is next to ngPostDeluxe.exe
            7z x release/libs/parpar-v0.4.6-win64.7z -oparpar_tmp
            Copy-Item (Get-ChildItem -Path parpar_tmp -Recurse -Filter parpar.exe | Select-Object -First 1).FullName dist/
          } else {
            # no 32 bit ParPar: par2cmdline (32 bit) is used
            Expand-Archive release/libs/par2cmdline-0.8.0-win-x86.zip -DestinationPath par2_tmp
            Copy-Item (Get-ChildItem -Path par2_tmp -Recurse -Filter par2.exe | Select-Object -First 1).FullName dist/
          }
          # 7-Zip (7z.exe + 7z.dll + its licence), used by default when no other path is defined (GNU LGPL, see 7-Zip/License.txt)
          # the 7-Zip installer is in the repository (release/libs): no download that can fail (GitHub answered 504 for hours).
          # Its SHA256 must be the one of the official file of 7-zip.org
          Copy-Item release/libs/${{ matrix.sevenzip }} 7zip-setup.exe
          $hash = (Get-FileHash 7zip-setup.exe -Algorithm SHA256).Hash
          if ($hash -ne '${{ matrix.sevenzip_sha256 }}') { throw "release/libs/${{ matrix.sevenzip }} has an unexpected SHA256: $hash" }
          Write-Host "${{ matrix.sevenzip }} SHA256: $((Get-FileHash 7zip-setup.exe -Algorithm SHA256).Hash)"
          7z x 7zip-setup.exe -o7zip_tmp -y | Out-Null
          New-Item -ItemType Directory dist/7-Zip | Out-Null
          Copy-Item 7zip_tmp/7z.exe, 7zip_tmp/7z.dll, 7zip_tmp/License.txt dist/7-Zip/
          # MediaInfo (command line, BSD-2-Clause): the media information of the NFO file. The official ZIP is in the repository (release/libs)
          Copy-Item release/libs/${{ matrix.mediainfo }} mediainfo.zip
          $miHash = (Get-FileHash mediainfo.zip -Algorithm SHA256).Hash
          if ($miHash -ne '${{ matrix.mediainfo_sha256 }}') { throw "release/libs/${{ matrix.mediainfo }} has an unexpected SHA256: $miHash" }
          Expand-Archive mediainfo.zip -DestinationPath mediainfo_tmp
          New-Item -ItemType Directory dist/MediaInfo | Out-Null
          Copy-Item mediainfo_tmp/MediaInfo.exe, mediainfo_tmp/License.html, mediainfo_tmp/LICENSE dist/MediaInfo/
          if (Test-Path mediainfo_tmp/LIBCURL.DLL) { Copy-Item mediainfo_tmp/LIBCURL.DLL dist/MediaInfo/ }
          Copy-Item ngPost.conf, LICENSE dist/
          Get-ChildItem dist | Format-Table Name, Length

      # Both tests run with a minimal PATH, so that a missing DLL in the package is detected
      # (with the full PATH the Qt DLLs of the runner would be found and hide the problem).
      - name: Smoke test 1 - command line (must start and print its help)
        shell: pwsh
        run: |
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          $out = & "$PWD\dist\ngPostDeluxe.exe" --help 2>&1 | Out-String
          Write-Host $out
          # 0xC0000135 = a DLL is missing; any other exit code only reflects the sample config (Linux paths)
          if ($LASTEXITCODE -eq -1073741515 -or $LASTEXITCODE -eq -1073741701) { throw "missing DLL (exit code $LASTEXITCODE)" }
          exit 0   # otherwise the step would fail with the exit code of ngPostDeluxe.exe (the sample config is for Linux)

      - name: Smoke test 3 - SSL support (OpenSSL DLLs loaded by Qt)
        shell: pwsh
        run: |
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          # minimal config (the sample ngPost.conf has Linux paths and would stop ngPost before printing the version)
          Set-Content -Path smoke.conf -Value "lang = EN`nnzbPath = $env:RUNNER_TEMP"
          $out = & "$PWD\dist\ngPostDeluxe.exe" -c smoke.conf -v 2>&1 | Out-String
          Write-Host $out
          if ($out -notmatch 'SSL support: yes' -or $out -notmatch 'system version: OpenSSL 1\.1\.1') { throw "OpenSSL is not loaded" }
          exit 0

      - name: Smoke test 2 - GUI (must stay open for 8 seconds)
        shell: pwsh
        run: |
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          $p = Start-Process -FilePath "$PWD\dist\ngPostDeluxe.exe" -WorkingDirectory "$PWD\dist" -PassThru
          Start-Sleep -Seconds 8
          if ($p.HasExited) { throw "the GUI closed by itself, exit code $($p.ExitCode)" }
          Write-Host "GUI is running"
          Stop-Process -Id $p.Id -Force

      - name: Remove the files created by the smoke tests
        shell: pwsh
        run: |
          # the diagnostics log of the GUI test (killed on purpose, on a CI server) must not be shipped:
          # it would make ngPost warn "the previous session did not end properly" at the first start
          Get-ChildItem -Path dist -Filter '*diagnostics*.log' -Force -ErrorAction SilentlyContinue | Remove-Item -Force

      - uses: actions/upload-artifact@v4
        with:
          name: ngPost-Deluxe-${{ matrix.name }}-${{ github.sha }}
          path: dist

      - name: Build the installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress | Out-Null
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found" }
          # a release (tag v1.3) uses the tag; any other build uses the version of the program (src/ngPost.pri), never a number written here
          $pri = Get-Content src\ngPost.pri -Raw
          if ($pri -notmatch 'APP_VERSION=\\"([0-9.]+)') { throw "APP_VERSION not found in src/ngPost.pri" }
          $ver = $Matches[1]
          if ('${{ github.ref_type }}' -eq 'tag' -and '${{ github.ref_name }}' -match '^v(.+)$') { $ver = $Matches[1] }
          # a release candidate (tag v1.3-rc1) keeps "-rc1" in the file name; the number inside the installer is only 1.3
          $num = $ver -replace '-.*$', ''
          & $iscc "/DAppVersion=$num" "/DArch=${{ matrix.arch }}" "/DSourceDir=$PWD\dist" "/DOutName=ngPostDeluxe-v$ver-${{ matrix.name }}-setup" installer\ngPostDeluxe.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed ($LASTEXITCODE)" }
          Get-ChildItem installer_out | Format-Table Name, Length

      - name: Installer test - silent install, start, uninstall
        shell: pwsh
        run: |
          $setup = (Get-ChildItem installer_out -Filter *-setup.exe | Select-Object -First 1).FullName
          $dir = 'C:\ngtest\ngPost Deluxe'
          # one single string: Start-Process does not quote the elements of an array (the path has a space, like C:\Program Files)
          $p = Start-Process -FilePath $setup -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /DIR=`"$dir`" /LOG=C:\ngtest-install.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content C:\ngtest-install.log -ErrorAction SilentlyContinue | Select-Object -Last 30; throw "install failed ($($p.ExitCode))" }
          Get-ChildItem $dir | Format-Table Name, Length
          foreach ($f in 'ngPostDeluxe.exe','7-Zip\7z.exe','7-Zip\7z.dll','7-Zip\License.txt','MediaInfo\MediaInfo.exe','MediaInfo\License.html','unins000.exe') {
            if (-not (Test-Path "$dir\$f")) { throw "missing after install: $f" }
          }
          if (Test-Path "$dir\ngPost.conf") { throw "the sample ngPost.conf must not be installed" }
          # the installed program must start (working folder = a folder without ngPost.conf) and must not need a writable program folder
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          New-Item -ItemType Directory C:\ngwork | Out-Null
          Push-Location C:\ngwork   # not the repository folder: it contains a (Linux) ngPost.conf
          $out = & "$dir\ngPostDeluxe.exe" -v 2>&1 | Out-String
          Pop-Location
          Write-Host $out
          if ($out -notmatch 'SSL support: yes') { throw "the installed program does not start correctly" }
          $g = Start-Process -FilePath "$dir\ngPostDeluxe.exe" -WorkingDirectory C:\ngwork -PassThru
          Start-Sleep -Seconds 8
          if ($g.HasExited) { throw "the installed GUI closed by itself, exit code $($g.ExitCode)" }
          Stop-Process -Id $g.Id -Force
          # the settings and the history are kept by a silent uninstall (the question is only asked in the normal one)
          $data = Join-Path $env:APPDATA 'ngPost Deluxe'
          New-Item -ItemType Directory -Force $data | Out-Null
          Set-Content -Path "$data\ngPost_history.csv" -Value 'test'
          $u = Start-Process -FilePath "$dir\unins000.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
          Start-Sleep -Seconds 3
          if (Test-Path "$dir\ngPostDeluxe.exe") { throw "ngPostDeluxe.exe still there after the uninstall" }
          if (-not (Test-Path "$data\ngPost_history.csv")) { throw "a silent uninstall must keep the settings and the history" }
          Write-Host "install / start / uninstall OK"

      - uses: actions/upload-artifact@v4
        with:
          name: ngPost-Deluxe-${{ matrix.name }}-installer-${{ github.sha }}
          path: installer_out/*.exe

      - name: Make the ZIP of the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force pkg/ngPostDeluxe | Out-Null
          Copy-Item dist/* pkg/ngPostDeluxe -Recurse
          Compress-Archive -Path pkg/ngPostDeluxe -DestinationPath "ngPostDeluxe-${{ github.ref_name }}-${{ matrix.name }}.zip"

      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: release-${{ matrix.name }}
          path: |
            ngPostDeluxe-*.zip
            installer_out/*.exe

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: zips
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -lR zips
          tag="${{ github.ref_name }}"
          # the ZIP files are in zips/ and the installers in zips/installer_out/: look in all the sub folders
          mapfile -t files < <(find zips -type f \( -name '*.zip' -o -name '*.exe' \) | sort)
          printf 'File to publish: %s\n' "${files[@]}"
          if [ "${#files[@]}" -ne 4 ]; then
            echo "::error::Expected 4 files (2 ZIP and 2 installers), found ${#files[@]}"
            exit 1
          fi
          # a tag with a "-" (v1.3-rc1) is a release candidate: it is published as a pre-release, to be tested before the real release
          if [[ "$tag" == *-* ]]; then pre=(--prerelease); else pre=(); fi
          if gh release view "$tag" >/dev/null 2>&1; then
            # the release was already created from the GitHub page ("Draft a new release"): add the files to it
            gh release upload "$tag" "${files[@]}" --clobber
            if [ "${#pre[@]}" -gt 0 ]; then gh release edit "$tag" --prerelease; fi
          elif [ "${#pre[@]}" -gt 0 ]; then
            gh release create "$tag" "${files[@]}" "${pre[@]}" --title "ngPost Deluxe $tag" --notes "Release candidate: a version to test before the real release. Please report any problem in the Issues."
          else
            gh release create "$tag" "${files[@]}" --title "ngPost Deluxe $tag" --notes-file RELEASE_NOTES.md
          fi
